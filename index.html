<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover hands us the full screen under the notch and home
         indicator; the transport pads itself back out with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>callnote.app — find it before the next one lands</title>

    <!--
      Apply the stored theme and skin before first paint so a reload never
      flashes the default and then snaps to the user's choice. Wrapped in
      try/catch because localStorage throws in some privacy modes.
    -->
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('fretboard-theme')
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme)
          }
          var skin = localStorage.getItem('fretboard-skin')
          var skins = { glass: 1, instrument: 1, editorial: 1, warm: 1 }
          if (skin && skins[skin]) {
            document.documentElement.setAttribute('data-skin', skin)
            var fonts = {
              instrument:
                'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap',
              warm: 'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap',
            }
            if (fonts[skin]) {
              var link = document.createElement('link')
              link.rel = 'stylesheet'
              link.href = fonts[skin]
              link.setAttribute('data-skin-font', skin)
              document.head.appendChild(link)
            }
          }
        } catch (e) {}
      })()
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The default skin's deepest ground, so the launch screen and the app
         agree on a colour instead of stepping between two near-blacks. -->
    <meta name="theme-color" content="#06131a" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The home-screen label: no room for the suffix, which the brand guide
         drops rather than shrinks. -->
    <meta name="apple-mobile-web-app-title" content="callnote" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      The webfont is loaded off the critical path: media="print" keeps it from
      blocking the first paint, and the onload flip applies it the moment it
      lands. Offline — or on a connection that never answers — the link simply
      never applies and every rule falls through to the system serif in its
      stack. The note glyph always paints, and so does the wordmark — Gabarito
      falls back to the same grotesk stack the body text uses.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800&family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
