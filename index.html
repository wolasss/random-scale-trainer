<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first for anything that understands one; the PNGs and the .ico are
         the fallback chain. /favicon.ico is also fetched blind, without being
         linked at all, by older browsers and by most link-preview crawlers. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <!-- viewport-fit=cover hands us the full screen under the notch and home
         indicator; the transport pads itself back out with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>callnote.app — Fretboard fluency, one beat at a time</title>

    <!-- The default skin's deepest ground, so the launch screen and the app
         agree on a colour instead of stepping between two near-blacks. The
         bootstrap below rewrites it to match the stored theme and skin. -->
    <meta name="theme-color" content="#06131a" />

    <!--
      Apply the stored theme and skin before first paint so a reload never
      flashes the default and then snaps to the user's choice — including the
      window chrome of an installed app, which the UA paints from theme-color
      and color-scheme. Only the reads are wrapped in try/catch, because
      localStorage throws in some privacy modes and the document still has to
      end up with a declared scheme. The grounds mirror SKIN_GROUND in
      src/lib/skins.ts (and `--bg-deep` in index.css); change all three together.
    -->
    <script>
      ;(function () {
        var theme = 'dark'
        var skin = 'glass'
        try {
          var storedTheme = localStorage.getItem('fretboard-theme')
          if (storedTheme === 'light' || storedTheme === 'dark') {
            theme = storedTheme
          }
          var storedSkin = localStorage.getItem('fretboard-skin')
          var skins = { glass: 1, instrument: 1, editorial: 1, warm: 1 }
          if (storedSkin && skins[storedSkin]) {
            skin = storedSkin
            document.documentElement.setAttribute('data-skin', skin)
            var fonts = {
              instrument:
                'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap',
              warm: 'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap',
            }
            if (fonts[skin]) {
              var link = document.createElement('link')
              link.rel = 'stylesheet'
              link.href = fonts[skin]
              link.setAttribute('data-skin-font', skin)
              document.head.appendChild(link)
            }
          }
        } catch (e) {}
        var grounds = {
          glass: { dark: '#06131a', light: '#f2f8ff' },
          instrument: { dark: '#070809', light: '#d7dade' },
          editorial: { dark: '#141310', light: '#efece2' },
          warm: { dark: '#241a18', light: '#fff6ee' },
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) {
          meta.content = grounds[skin][theme]
        }
      })()
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The home-screen label: no room for the suffix, which the brand guide
         drops rather than shrinks. -->
    <meta name="apple-mobile-web-app-title" content="callnote" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      The webfont is loaded off the critical path: media="print" keeps it from
      blocking the first paint, and the onload flip applies it the moment it
      lands. Offline — or on a connection that never answers — the link simply
      never applies and every rule falls through to the system serif in its
      stack. The note glyph always paints, and so does the wordmark — Gabarito
      falls back to the same grotesk stack the body text uses.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800&family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
