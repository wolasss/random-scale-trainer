<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover hands us the full screen under the notch and home
         indicator; the transport pads itself back out with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Random notes trainer</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#061014" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      The webfont is loaded off the critical path: media="print" keeps it from
      blocking the first paint, and the onload flip applies it the moment it
      lands. Offline — or on a connection that never answers — the link simply
      never applies and every rule falls through to the system serif in its
      stack. The note glyph always paints.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
