server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker and the manifest are the two files that must never be
  # served stale: a cached sw.js is a build the browser can never move off.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
    try_files $uri =404;
  }

  # index.html is the shell every navigation resolves to; it names the hashed
  # bundles, so it has to be revalidated for a new build to ever be seen.
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Basic static caching
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp3)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
