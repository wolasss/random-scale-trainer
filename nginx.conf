server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the nginx version in Server: or on error pages.
  server_tokens off;

  # Bound how long a caller may take to send its request line/headers, and how
  # long it may go idle between body reads. nginx is the client-facing
  # listener — src/server/http.js's own HEADERS_TIMEOUT_MS/REQUEST_TIMEOUT_MS
  # only govern the fast loopback connection nginx makes to it, so without
  # these a public caller could still trickle either for nginx's much longer
  # defaults (60s).
  client_header_timeout 10s;
  client_body_timeout 10s;

  # Security response headers. `script-src` still needs 'unsafe-inline': the
  # shell carries two inline scripts of its own — the pre-paint theme/skin
  # bootstrap and the `onload` media swap on the webfont link. `media-src`
  # needs `data:` for the silent WAV in src/lib/audio/engine.ts, which claims
  # the iOS media session so the metronome survives the ringer switch.
  # `base-uri` and `form-action` are spelled out because they are among the
  # few directives that don't fall back to `default-src`: left off, an injected
  # <base> could repoint every relative bundle URL and an injected form could
  # post anywhere.
  #
  # `microphone=(self)` — never `*` — is what lets the app ask for the mic at
  # all: scoring a shared challenge is listening to what was played. Only this
  # origin may; an embedded frame still gets nothing.
  #
  # nginx's add_header does not merge: a location that declares any add_header
  # of its own inherits none of these, so every such block below repeats the
  # set. `always` keeps them on error responses too.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shared-challenge scoreboard — the one thing here that is not a static
  # file. src/server/main.js is started alongside nginx by
  # /docker-entrypoint.d/50-scoreboard.sh and listens on loopback only, so this
  # proxy is the only way in. A live board must never be cached: not by a proxy
  # in front, and not by the service worker, which is told to leave /api/ alone
  # for the same reason.
  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Set, never appended to. The appending form of this keeps whatever the
    # caller sent and puts nginx's own observation after it — and the scoreboard
    # rate limits key on this header, so a caller able to prepend hops of their
    # own invention would take a fresh bucket per request. Written this way the
    # only hop in it is the address nginx actually saw. deploy.test.ts pins it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # nginx buffers a request body in full before proxying it by default,
    # which would let a slow public body clear http.js's own streaming cap and
    # REQUEST_TIMEOUT_MS having only ever seen the fast, already-complete
    # loopback read. Streaming instead means those protections bound the
    # public connection they were written for.
    proxy_request_buffering off;
    # A coarse guard ahead of MAX_BODY_BYTES (4096 in http.js): with buffering
    # off nginx would otherwise open the upstream connection for any declared
    # size at all.
    client_max_body_size 8k;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # The service worker and the manifest are the two files that must never be
  # served stale: a cached sw.js is a build the browser can never move off.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # The policy served with the worker script governs the worker itself, and
    # the worker fetches the webfont cross-origin to cache it (FONT_HOSTS in
    # src/sw/service-worker.js), so its connect-src has to allow those hosts.
    # The page's own policy stays at connect-src 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    types { } default_type application/manifest+json;
    try_files $uri =404;
  }

  # index.html is the shell every navigation resolves to; it names the hashed
  # bundles, so it has to be revalidated for a new build to ever be seen.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri =404;
  }

  # Basic static caching
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp3)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri =404;
  }
}
