server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the nginx version in Server: or on error pages.
  server_tokens off;

  # Security response headers. `script-src` still needs 'unsafe-inline': the
  # shell carries two inline scripts of its own — the pre-paint theme/skin
  # bootstrap and the `onload` media swap on the webfont link.
  #
  # nginx's add_header does not merge: a location that declares any add_header
  # of its own inherits none of these, so every such block below repeats the
  # set. `always` keeps them on error responses too.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker and the manifest are the two files that must never be
  # served stale: a cached sw.js is a build the browser can never move off.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The policy served with the worker script governs the worker itself, and
    # the worker fetches the webfont cross-origin to cache it (FONT_HOSTS in
    # src/sw/service-worker.js), so its connect-src has to allow those hosts.
    # The page's own policy stays at connect-src 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    types { } default_type application/manifest+json;
    try_files $uri =404;
  }

  # index.html is the shell every navigation resolves to; it names the hashed
  # bundles, so it has to be revalidated for a new build to ever be seen.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    try_files $uri =404;
  }

  # Basic static caching
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp3)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    try_files $uri =404;
  }
}
